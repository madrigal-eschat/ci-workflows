name: Markdown lint

on:
  workflow_call:
    inputs:
      files:
        description: >
          Space-separated list of files or globs to lint. Defaults to README.md.
        type: string
        required: false
        default: 'README.md'

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install markdownlint-cli2
        run: npm install --no-save markdownlint-cli2

      - name: Lint markdown
        env:
          FILES: ${{ inputs.files }}
        run: xargs npx markdownlint-cli2 <<< "$FILES"
