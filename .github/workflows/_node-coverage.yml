name: Node Coverage

on:
  workflow_call:
    inputs:
      working-directory:
        description: Path to the Node project root, relative to the repo root.
        type: string
        required: false
        default: '.'
      node-version-file:
        description: Path to the Node version file, relative to the repo root.
        type: string
        required: false
        default: '.nvmrc'
      base-ref:
        description: Base branch name to diff against (e.g. main).
        type: string
        required: false
        default: main
      coverage-file:
        description: LCOV report path, relative to the Node project root.
        type: string
        required: false
        default: coverage/lcov.info

jobs:
  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
          cache-dependency-path: >-
            ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate coverage report
        run: npm test -- --coverage

      - name: Install diff-cover
        run: pip install diff-cover

      - name: Check diff coverage
        run: >
          diff-cover ${{ inputs.coverage-file }}
          --compare-branch=origin/${{ inputs.base-ref }}
          --fail-under=100
          --diff-range-notation=...
