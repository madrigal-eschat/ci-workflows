name: Node CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: Path to the Node project root, relative to the repo root.
        type: string
        required: false
        default: '.'
      node-version-file:
        description: Path to the Node version file, relative to the repo root.
        type: string
        required: false
        default: '.nvmrc'
      diff-coverage:
        description: >-
          Require 100% coverage of changed lines on pull requests. The caller's
          `test` script must accept `--coverage` and write an LCOV report.
        type: boolean
        required: false
        default: true
      base-ref:
        description: Base branch name to diff against (e.g. main).
        type: string
        required: false
        default: main
      coverage-file:
        description: LCOV report path, relative to the Node project root.
        type: string
        required: false
        default: coverage/lcov.info

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
          cache-dependency-path: >-
            ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm test -- --coverage

      - name: Install diff-cover
        if: github.event_name == 'pull_request' && inputs.diff-coverage
        run: pip install diff-cover

      - name: Check diff coverage
        if: github.event_name == 'pull_request' && inputs.diff-coverage
        run: >
          diff-cover ${{ inputs.coverage-file }}
          --compare-branch=origin/${{ inputs.base-ref }}
          --fail-under=100
          --diff-range-notation=...
